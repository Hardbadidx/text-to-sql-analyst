[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text2sql-analyst"
version = "0.1.0"
description = "Production-grade, safety-first Text-to-SQL agent with self-correction and evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "sqlglot>=23.0.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "faker>=25.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "google-genai>=0.1.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["text2sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
timeout = 60
pythonpath = ["."]
