name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest -q

  docker:
    name: Docker Build & Healthcheck
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t text2sql-analyst:ci .

      - name: Verify module imports inside container
        run: |
          docker run --rm text2sql-analyst:ci python -c "import app.ui_utils, text2sql.agent"

      - name: Run container & verify healthcheck
        run: |
          # Start container in detached mode with unprivileged appuser
          docker run -d --name test-container -p 8501:8501 text2sql-analyst:ci
          
          # Poll health endpoint with timeout (up to 60s)
          timeout 60s bash -c '
            echo "Waiting for Streamlit server health endpoint..."
            until curl -s -f http://localhost:8501/_stcore/health; do
              sleep 2
            done
            echo "Health endpoint is UP!"
          '
          
          # Confirm container is running healthy
          docker ps | grep test-container
          
          # Cleanup container
          docker stop test-container
          docker rm test-container
